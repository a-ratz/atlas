    # Auditory closed-loop stimulation of the sleep slow oscillation enhances memory (Ngo et al., 2013)

    Neuron. Clicks timed to the up-phase of slow oscillations enhanced the oscillations and improved overnight retention of word pairs; out-of-phase clicks did not.
