    ---

    # Promoting memory consolidation during sleep: a meta-analysis of targeted memory reactivation (Hu et al., 2020)

    Psychological Bulletin. Across 91 experiments, cues during NREM sleep improved later memory with a small to moderate effect; cues during REM sleep and wake did not show a reliable benefit.
