  insights/naps-give-part-of-the-benefit.md: |
    ---
    description: Short daytime naps improved retention of word lists compared with staying awake in several lab studies.
    category: sleep
    confidence: speculative
    source: "[[diekelmann-born-2010]]"
    created_by: claude
    updated_by: claude
    ---

    # A nap with slow-wave sleep gives part of a night's benefit for new facts

    Lab studies (Lahl et al. 2008; Mednick et al. 2003 for perceptual learning)
    found benefits from naps of under an hour. Effects are smaller than a full
    night and depend on whether the nap reaches slow-wave sleep.

    Related:
    - [[sleep-protects-new-facts]] — the full-night version
    - [[spacing-plus-sleep]] — a nap between sessions as a cheap spacing gap
  insights/optimal-gap-grows-with-retention.md: |
    ---
    description: To remember for a year, review weeks apart; for a week, a day apart (Cepeda et al. 2008).
    category: learning
    confidence: working
    source: "[[dunlosky-2013-learning-techniques]]"
    created_by: claude
    updated_by: claude
    ---

    # The best gap between reviews grows with how long you need to remember

    Cepeda et al. (2008) varied gap and test delay at scale: the optimal gap was
    roughly 10 to 20 percent of the retention interval, shrinking as a share for
    longer intervals. A rule of thumb, not a law.

    Related:
    - [[spacing-beats-massing]] — the effect this tunes
  insights/pretesting-primes-learning.md: |
    ---
    description: Trying to answer questions before studying, even wrongly, improved later recall of the answers (Richland et al. 2009).
    category: learning
    confidence: working
    source: "[[dunlosky-2013-learning-techniques]]"
    created_by: claude
    updated_by: claude
    ---

    # Guessing before you study improves what you learn afterwards

    Pretests direct attention to what matters and turn the later reading into
    feedback. Wrong guesses do not seem to stick when the answer follows.

    Related:
    - [[errors-with-feedback-teach]] — why wrong guesses do not hurt
    - [[testing-beats-rereading]] — testing after study
  insights/rem-role-is-contested.md: |
    ---
    description: Findings that REM sleep strips the emotional tone from memories have not replicated cleanly.
    category: sleep
    confidence: speculative
    source: "[[diekelmann-born-2010]]"
    created_by: claude
    updated_by: claude
    ---

    # REM sleep's role in emotional memory is contested, so it should not anchor product claims

    Some studies report that REM sleep preserves emotional memories while softening
    their emotional charge; others fail to replicate it. Nightlight should not make
    claims that rest on it.

    Related:
    - [[tmr-effect-is-smaller-than-first-reports]] — cueing in REM showed no reliable benefit either
  insights/replay-reruns-the-day.md: |
    ---
    description: Place-cell sequences from waking exploration reappear in sleep, faster, in rats (Wilson & McNaughton 1994).
    category: sleep
    confidence: working
    source: "[[diekelmann-born-2010]]"
    created_by: claude
    updated_by: claude
    ---

    # Hippocampal replay during sleep re-runs the day's sequences, compressed in time

    Wilson & McNaughton (1994) found that hippocampal cells that fired together
    during exploration fired together again during subsequent sleep. Later work
    (Ji & Wilson 2007) showed whole sequences replayed several times faster.
    Evidence in humans is indirect.

    Related:
    - [[spindles-lock-to-slow-oscillations]] — replay rides on sharp-wave ripples nested in spindles
    - [[tmr-cues-reactivate-memories]] — cueing tries to trigger replay on purpose
