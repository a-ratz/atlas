    # The memory function of sleep (Diekelmann & Born, 2010)

    Review in Nature Reviews Neuroscience. Sleep after learning supports the consolidation of declarative and procedural memories; the active systems account puts slow oscillations, spindles and hippocampal ripples at the centre of it.
  sources/dunlosky-2013-learning-techniques.md: |
    ---
    authors: [John Dunlosky, Katherine A. Rawson, Elizabeth J. Marsh, Mitchell J. Nathan, Daniel T. Willingham]
    url: "https://doi.org/10.1177/1529100612453266"
    date: 2013-01-01
    source_type: paper
    created_by: claude
    updated_by: claude
    ---

    # Improving students' learning with effective learning techniques (Dunlosky et al., 2013)

    Psychological Science in the Public Interest. Rates ten techniques: practice testing and distributed practice get high utility; elaborative interrogation and interleaving moderate; rereading and highlighting low.
  sources/hu-2020-tmr-meta-analysis.md: |
