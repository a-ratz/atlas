    # Consumer EEG headbands that can time sounds to slow oscillations

    ## Short answer

    A few research-grade headbands expose a live EEG stream and offer phase-locked
    audio; most consumer sleep headbands only report stages after the night.

    ## Open questions

    - Latency from detection to sound on each device.
    - Comfort over a full night.
  captures/sleep-and-vocabulary.md: |
    ---
    kind: research
    question: Does sleep help adults learn new words?
    date: {{day:-1}}
    source_type: web
    created_by: claude
    updated_by: claude
    ---

    # Sleep helps new words join the mental lexicon

    ## Short answer

    Probably yes: new words start to compete with known ones after a night of sleep,
    a sign they have joined the lexicon (Dumay & Gaskell 2007). Effects on plain
    recall are smaller.

    ## What the sources say

    - Lexical competition from new words appears after sleep, not after the same time awake.
    - Spindle density has been linked to the integration in some studies.

    ## Open questions

    - Does a nap do the same?
  insights/closed-loop-stimulation-deepens-slow-oscillations.md: |
    ---
    description: Clicks locked to the slow-oscillation phase enhanced the oscillations and overnight retention (Ngo et al. 2013).
    category: interventions
    confidence: speculative
    source: "[[ngo-2013-closed-loop]]"
    created_by: claude
    updated_by: claude
    ---

    # Sounds timed to the up-phase of slow oscillations deepen them and improve next-day recall

    Ngo et al. (2013) played short clicks in phase with ongoing slow oscillations.
    The oscillations grew and word-pair retention improved; clicks out of phase did
    nothing. Replications at home with consumer devices are still few.

    Related:
    - [[spindles-lock-to-slow-oscillations]] — the rhythm being amplified
    - [[cueing-at-home-needs-eeg]] — phase-locking needs a live signal
  insights/cueing-at-home-needs-eeg.md: |
    ---
    description: Both TMR in NREM and phase-locked stimulation depend on knowing the sleep stage and the oscillation phase in real time.
    category: interventions
    confidence: speculative
    source: "[[ngo-2013-closed-loop]]"
    created_by: claude
    updated_by: claude
    ---

    # Cueing at home needs a live EEG signal, not an accelerometer

    Follows from the two notes it links: cues only help in NREM, and phase-locked
    sounds need the oscillation itself. A headband with EEG can provide both; a
    wrist tracker cannot.

    Related:
    - [[trackers-stage-sleep-loosely]] — why the wrist is not enough
    - [[closed-loop-stimulation-deepens-slow-oscillations]] — what phase-locking needs
  insights/desirable-difficulties.md: |
    ---
    description: Spacing, testing and interleaving all feel harder during study and pay off on delayed tests (Bjork).
    category: learning
    confidence: working
    source: "[[dunlosky-2013-learning-techniques]]"
    created_by: claude
    updated_by: claude
    ---

    # Conditions that slow learning down often make it last longer

    Robert and Elizabeth Bjork's term for a family of findings: what makes study
    feel slow and effortful often improves long-term retention. Not every
    difficulty is desirable; it has to engage retrieval or discrimination.

    Related:
    - [[testing-beats-rereading]] — testing
    - [[spacing-beats-massing]] — spacing
    - [[interleaving-teaches-when]] — interleaving
  insights/elaboration-ties-new-to-old.md: |
    ---
    description: Elaborative interrogation helps most when learners have prior knowledge of the domain (moderate utility in Dunlosky et al.).
    category: learning
    confidence: speculative
    source: "[[dunlosky-2013-learning-techniques]]"
    created_by: claude
    updated_by: claude
    ---

    # Explaining why a fact is true ties it to what you already know

    Asking "why would this be true?" for each fact improves recall in several
    studies, more for learners who know the domain. Dunlosky et al. (2013) rate it
    moderate utility.

    Related:
    - [[desirable-difficulties]] — effortful in the same way
  insights/errors-with-feedback-teach.md: |
    ---
    description: High-confidence errors corrected by feedback are remembered especially well (the hypercorrection effect).
    category: learning
    confidence: speculative
    source: "[[dunlosky-2013-learning-techniques]]"
    created_by: claude
    updated_by: claude
    ---

    # Errors followed by quick feedback teach more than errorless study

    Butterfield & Metcalfe (2001) found that confidently wrong answers, once
    corrected, were the most likely to be right later. The benefit needs feedback
    soon after the error.

    Related:
    - [[pretesting-primes-learning]] — a deliberate use of it
  insights/fluency-misleads-learners.md: |
    ---
    description: Judgments of learning follow ease of processing, which rereading raises without raising later recall.
    category: learning
    confidence: working
    source: "[[dunlosky-2013-learning-techniques]]"
    created_by: claude
    updated_by: claude
    ---

    # Feeling fluent while rereading makes learners overrate what they know

    Familiar text reads easily, and ease feels like knowing. Learners therefore
    prefer rereading and underrate testing, the opposite of what delayed tests show.

    Related:
    - [[testing-beats-rereading]] — the counter-move
    - [[desirable-difficulties]] — the general pattern
  insights/interleaving-teaches-when.md: |
    ---
    description: Interleaved practice improved later test scores over blocked practice in maths problems (Rohrer & Taylor 2007).
    category: learning
    confidence: working
    source: "[[dunlosky-2013-learning-techniques]]"
    created_by: claude
    updated_by: claude
    ---

    # Mixing problem types teaches when to use which method

    Blocked practice tells you which method to use; interleaving makes you choose,
    and choosing is part of what the test asks. Benefits are strongest when
    problem types look alike.

    Related:
    - [[desirable-difficulties]] — a case of it
