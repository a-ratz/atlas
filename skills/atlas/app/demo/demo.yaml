    # Analysis: cueing during sleep

    The first cueing studies reported large effects with small samples. The
    meta-analysis (Hu et al. 2020) confirms a benefit for cues during NREM sleep,
    smaller than the early studies, and none for REM. Timing the cue to the slow
    oscillation needs a live EEG signal.
