    # Sleep and memory

    Read in order: the effect, then the mechanisms, then what is disputed.

    ## The effect

    - [[sleep-protects-new-facts]]
    - [[sleep-loss-impairs-encoding]]
    - [[naps-give-part-of-the-benefit]]
    - [[sleep-favours-expected-memories]]

    ## Mechanisms

    - [[replay-reruns-the-day]]
    - [[spindles-lock-to-slow-oscillations]]
    - [[synaptic-scaling-makes-room]]

    ## Disputed

    - [[rem-role-is-contested]]
  insights/sleep-favours-expected-memories.md: |
    ---
    description: Learners told they would be tested later benefited more from sleep than learners who were not (Wilhelm et al. 2011).
    category: sleep
    confidence: working
    source: "[[diekelmann-born-2010]]"
    created_by: claude
    updated_by: claude
    ---

    # Sleep favours the memories you expect to need

    In Wilhelm et al. (2011), sleep improved retention mainly when participants
    expected a later test. Consolidation seems to select, not to keep everything.

    Related:
    - [[testing-beats-rereading]] — testing before sleep marks what matters
    - [[sleep-protects-new-facts]] — the general benefit
  insights/sleep-loss-impairs-encoding.md: |
    ---
    description: Sleep deprivation before learning reduced hippocampal activity during encoding and later recall (Yoo et al. 2007).
    category: sleep
    confidence: working
    source: "[[diekelmann-born-2010]]"
    created_by: claude
    updated_by: claude
    ---

    # A night without sleep cuts the next day's capacity to form new memories

    In Yoo et al. (2007) a night of sleep deprivation before learning lowered recall
    of pictures learned the next day, together with weaker hippocampal activation
    during encoding. Sleep matters before learning, not only after.

    Related:
    - [[sleep-protects-new-facts]] — after learning
    - [[synaptic-scaling-makes-room]] — one proposed reason
  insights/sleep-protects-new-facts.md: |
    ---
    description: Retention after a night of sleep beats an equal waking interval, most clearly for declarative memories.
    category: sleep
    confidence: working
    source: "[[diekelmann-born-2010]]"
    created_by: claude
    updated_by: claude
    ---

    # Sleep after learning protects new facts better than the same hours awake

    Across many studies reviewed by Diekelmann & Born (2010), people who sleep after
    learning word pairs or facts recall more than people who stay awake for the same
    time. The benefit is largest for memories that were weakly encoded.

    Related:
    - [[replay-reruns-the-day]] — the mechanism the active systems account proposes
    - [[sleep-loss-impairs-encoding]] — the other side: sleep before learning
  insights/spacing-beats-massing.md: |
    ---
    description: The spacing effect is one of the most replicated findings in learning research (Cepeda et al. 2006).
    category: learning
    confidence: proven
    source: "[[dunlosky-2013-learning-techniques]]"
    created_by: claude
    updated_by: claude
    ---

    # Spreading the same study time across days beats cramming it into one session

    A meta-analysis by Cepeda et al. (2006) covering hundreds of experiments found
    distributed practice beats massed practice for later recall. Dunlosky et al.
    (2013) rate it high utility.

    Related:
    - [[optimal-gap-grows-with-retention]] — how long the gaps should be
    - [[spacing-plus-sleep]] — what a night in the gap may add
  insights/spacing-plus-sleep.md: |
    ---
    description: Distributed practice and sleep-dependent consolidation may add up when every gap between reviews contains a night.
    category: interventions
    confidence: speculative
    source: "[[dunlosky-2013-learning-techniques]]"
    created_by: claude
    updated_by: claude
    ---

    # Spacing reviews across days lets each night consolidate the previous review

    A combination worth testing rather than a finding: spacing works across many
    gaps, and a gap with sleep in it adds consolidation. Few studies separate the
    two effects.

    Related:
    - [[spacing-beats-massing]] — the spacing effect
    - [[sleep-protects-new-facts]] — the sleep effect
  insights/spindles-lock-to-slow-oscillations.md: |
    ---
    description: Precise coupling of spindles to the slow-oscillation up-state predicted retention in older adults (Helfrich et al. 2018).
    category: sleep
    confidence: speculative
    source: "[[diekelmann-born-2010]]"
    revisit_after: 2026-12-01
    created_by: claude
    updated_by: claude
    ---

    # Overnight retention tracks how tightly spindles lock to slow oscillations, not how many there are

    Helfrich et al. (2018) reported that spindles arriving at the peak of the slow
    oscillation predicted overnight memory, and that this coupling loosens with age.
    One lab, one task: worth tracking, not yet worth building on.

    Related:
    - [[closed-loop-stimulation-deepens-slow-oscillations]] — a way to strengthen the oscillation itself
    - [[replay-reruns-the-day]] — what the coupling is thought to carry
  insights/synaptic-scaling-makes-room.md: |
    ---
    description: The synaptic homeostasis hypothesis (Tononi & Cirelli) says waking strengthens synapses and sleep renormalises them.
    category: sleep
    confidence: speculative
    source: "[[diekelmann-born-2010]]"
    created_by: claude
    updated_by: claude
    ---

    # Sleep may make room for new learning by scaling synapses back down

    On this account, the brain cannot keep strengthening synapses all day; slow-wave
    sleep scales them down and keeps the strongest. It competes with, and partly
    complements, the active systems account. Both explain some findings well.

    Related:
    - [[sleep-loss-impairs-encoding]] — would follow if sleep restores capacity
    - [[sleep-protects-new-facts]] — the competing explanation
  insights/testing-beats-rereading.md: |
    ---
    description: Practice tests beat rereading on delayed tests, even without feedback (Roediger & Karpicke 2006).
    category: learning
    confidence: proven
    source: "[[dunlosky-2013-learning-techniques]]"
    created_by: claude
    updated_by: claude
    ---

    # Retrieving a fact strengthens it more than reading it again

    Roediger & Karpicke (2006): students who took recall tests on a passage
    remembered more a week later than students who reread it, although rereading
    felt more effective. Dunlosky et al. (2013) rate practice testing high utility.

    Related:
    - [[fluency-misleads-learners]] — why rereading feels better
    - [[sleep-favours-expected-memories]] — a test before sleep tags what to keep
  insights/tmr-cues-reactivate-memories.md: |
    ---
    description: An odour or sound paired with learning and replayed in slow-wave sleep improved recall of that material.
    category: interventions
    confidence: working
    source: "[[hu-2020-tmr-meta-analysis]]"
    created_by: claude
    updated_by: claude
    ---

    # Cues played during slow-wave sleep strengthen the memories they were paired with

    Rasch et al. (2007) paired a rose odour with learning card locations and
    presented it again during slow-wave sleep: recall improved. Rudoy et al. (2009)
    did the same with object sounds, item by item. The method is called targeted
    memory reactivation (TMR).

    Related:
    - [[tmr-effect-is-smaller-than-first-reports]] — how big the effect really is
    - [[replay-reruns-the-day]] — what the cue is meant to trigger
  insights/tmr-effect-is-smaller-than-first-reports.md: |
    ---
    description: A meta-analysis of 91 experiments found a small to moderate benefit for NREM cues and none for REM or wake cues.
    category: interventions
    confidence: working
    source: "[[hu-2020-tmr-meta-analysis]]"
    created_by: claude
    updated_by: claude
    ---

    # Targeted memory reactivation helps, but less than the first studies suggested

    Hu et al. (2020) pooled the TMR literature: cues during NREM sleep reliably
    help, with a smaller effect than the early single studies. For Nightlight this
    sets expectations: a modest, real effect, not a memory hack.

    Related:
    - [[tmr-cues-reactivate-memories]] — the original findings
    - [[cueing-at-home-needs-eeg]] — what it takes to deliver cues in NREM at home
  insights/trackers-stage-sleep-loosely.md: |
    ---
    description: Wrist trackers agree with lab polysomnography on sleep versus wake far better than on the stage of each 30-second epoch.
    category: interventions
    confidence: working
    source: "[[hu-2020-tmr-meta-analysis]]"
    created_by: claude
    updated_by: claude
    ---

    # Consumer wearables estimate sleep stages too loosely to time cues to them

    Validation studies of wrist-worn trackers find good agreement with
    polysomnography for total sleep and modest agreement for stages. A cue meant for
    slow-wave sleep would often land in the wrong stage.

    Related:
    - [[cueing-at-home-needs-eeg]] — the consequence for Nightlight
    - [[tmr-effect-is-smaller-than-first-reports]] — a mistimed cue wastes a small effect
