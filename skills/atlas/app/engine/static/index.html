<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atlas</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23F4BF4F' stroke-width='1.8'><circle cx='12' cy='12' r='9.5'/><ellipse cx='12' cy='12' rx='4.2' ry='9.5'/><path d='M2.5 12h19M4.2 7.5h15.6M4.2 16.5h15.6'/></svg>">
  <link rel="preload" href="/static/vendor/fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/vendor/fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
  <script>
    window.ATLAS_V = "__ATLAS_V__";
    try { const t = localStorage.getItem("atlas.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn only-mobile" id="nav-toggle" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 16 16"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg></button>
    <a class="brand" href="#/"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><ellipse cx="12" cy="12" rx="4.2" ry="9.5"/><path d="M2.5 12h19M4.2 7.5h15.6M4.2 16.5h15.6"/></svg><span>Atlas</span></a>
    <form class="search" id="search-form" role="search">
      <label class="search-box">
        <svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
        <span class="sr">Search the vault</span>
        <input id="search-input" type="search" placeholder="Search the vault…" autocomplete="off">
        <kbd>⌘K</kbd>
      </label>
    </form>
    <div class="top-actions">
      <div class="presence" id="presence"></div>
      <button class="icon-btn" id="theme-toggle" aria-label="Switch between dark and light"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6"/><path d="M8 2.4v11.2A5.6 5.6 0 0 0 8 2.4Z" fill="currentColor" stroke="none"/></svg></button>
      <button class="icon-btn" id="chat-toggle" aria-label="Operator chat"><svg viewBox="0 0 16 16"><path d="M3 3.5h10a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H7l-3 2.5v-2.5H3a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1Z"/></svg></button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Atlas"></nav>
    <main class="main" id="main"><div class="loading">Loading the atlas…</div></main>
    <aside class="dock" id="chat" aria-label="Operator chat">
      <div class="dock-head">
        <div style="flex: 1; min-width: 0">
          <div class="dock-title">Operator</div>
          <div class="dock-sub" id="chat-sub"></div>
        </div>
        <a class="icon-btn" href="#/chat" aria-label="Open the operator view"><svg viewBox="0 0 16 16"><path d="M9.5 2.5h4v4M6.5 13.5h-4v-4M13.5 2.5 9 7M2.5 13.5 7 9"/></svg></a>
        <button class="icon-btn" id="chat-close" aria-label="Close the chat"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
      </div>
      <div class="chat-log" id="chat-log"></div>
      <div id="dock-composer"></div>
    </aside>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <a href="#/" data-tab="home"><svg viewBox="0 0 16 16"><path d="M2.5 7.5 8 3l5.5 4.5V13a.5.5 0 0 1-.5.5H3a.5.5 0 0 1-.5-.5Z"/></svg>Home</a>
    <a href="#/chat" data-tab="chat"><svg viewBox="0 0 16 16"><path d="M3 3.5h10a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H7l-3 2.5v-2.5H3a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1Z"/></svg>Operator</a>
    <a href="#/projects" data-tab="projects"><svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/></svg>Projects</a>
    <a href="#/graph" data-tab="graph"><svg viewBox="0 0 16 16"><circle cx="4" cy="11" r="1.6"/><circle cx="8" cy="4" r="1.6"/><circle cx="12.5" cy="10" r="1.6"/><path d="M4.8 9.6 7.2 5.4M9 5.3l2.6 3.4M5.6 10.8l5.3-.6"/></svg>Graph</a>
  </nav>

  <div class="toast" id="toast" role="status" hidden></div>
  <div class="toast undo" id="undo" role="status" hidden></div>
  <div class="hovercard" id="hovercard" hidden></div>
  <div class="quote-bar" id="quote-bar" role="toolbar" aria-label="Quote this passage" hidden></div>
  <div class="drop-veil" id="drop-veil" hidden><div class="drop-box"><div class="serif">Drop to capture</div><p id="drop-what"></p></div></div>
  <div class="pal-back" id="palette" hidden><div class="pal" role="dialog" aria-modal="true" aria-label="Go to">
    <div class="pal-in"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
      <input id="pal-input" autocomplete="off" spellcheck="false" placeholder="Notes, places, projects…   > for commands" aria-controls="pal-list"><kbd>esc</kbd></div>
    <div class="pal-list" id="pal-list" role="listbox"></div>
  </div></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
