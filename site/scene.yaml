        name: Dumay
        aliases: [Dumay]
        role: first author of the 2007 study on new words and sleep (Dumay & Gaskell 2007)
        depth: minimal
        ---

        # Dumay

        First author of the study the vocabulary insight rests on: new words compete with
        known ones only after sleep.

        ## Timeline

        - Card created from [[sleep-and-vocabulary]]; named in [[new-words-join-the-lexicon-overnight]]. (Source: the capture)
      cabinet/people/gaskell.md: |
        ---
        name: Gaskell
        aliases: [Gaskell]
        role: co-author of the 2007 study on new words and sleep (Dumay & Gaskell 2007)
        depth: minimal
        ---

        # Gaskell

        Co-author of the study the vocabulary insight rests on.

        ## Timeline

        - Card created from [[sleep-and-vocabulary]]; named in [[new-words-join-the-lexicon-overnight]]. (Source: the capture)
      cabinet/people/tamminen.md: |
        ---
        name: Tamminen
        aliases: [Tamminen]
        role: first author of the 2010 study linking spindles to word integration (Tamminen et al. 2010)
        depth: minimal
