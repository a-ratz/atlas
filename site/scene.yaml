        # Tamminen

        First author of the correlational study behind the spindle insight.

        ## Timeline

        - Card created from [[sleep-and-vocabulary]]; named in [[spindles-track-word-integration]]. (Source: the capture)
    edit:
      insights/sleep-and-memory-map.md:
        - ["- [[sleep-favours-expected-memories]]\n", "- [[sleep-favours-expected-memories]]\n- [[new-words-join-the-lexicon-overnight]]\n"]
        - ["- [[synaptic-scaling-makes-room]]\n", "- [[synaptic-scaling-makes-room]]\n- [[spindles-track-word-integration]]\n"]
    move: {captures/sleep-and-vocabulary.md: sources/sleep-and-vocabulary.md}
    commit: "distill: sleep-and-vocabulary"
  - progress: "atlas.py check: no problems"
    check: true
    pause: 1200
  - pause: 1300
    open: insights/new-words-join-the-lexicon-overnight.md
    say: |
      Two insights from the capture:

      ```atlas:notes
      - insights/new-words-join-the-lexicon-overnight.md
      - insights/spindles-track-word-integration.md
      ```

      The spindle link stays **speculative**: one correlational study. Both sit in the Sleep and
